name: Generate Contribution Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MrFaraidun
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#a7c080&color_dots=#1e2326,#2d353b,#475258,#7fbbb3,#a7c080
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a7c080&color_dots=#1e2326,#2d353b,#475258,#7fbbb3,#a7c080

      - name: Commit and Push Snake SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake*.svg || true
          git diff --staged --quiet || (git commit -m "chore: update animated contribution snake" && git push)
